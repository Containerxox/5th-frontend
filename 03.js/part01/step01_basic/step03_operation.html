<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operation</title>
</head>
<body>
    <script>
        let v1 = 10;
        let v2 = 3;
        let v3 = '10';
        
        // console.log(v1 ** v2);
        console.log(v1);
        console.log(v3);
        console.log(v1 == v3); //true 
        console.log(v1 + v3); // 1010

        // ● 타입 비교 ( === )
        console.log(v1 === v3) //false

        // or, false, !
        let t = true;
        let f = false;
        console.log(t || t);
        console.log(t || f);
        console.log(f || t);
        console.log(f || f);


    </script>
</body>
</html>
