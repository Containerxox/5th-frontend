        // ▶ 프로미스 Promise (콜백 지옥을 해결하기 위해 나타난!)
        //   : 비동기 작업의 완료/실패를 나타내는 객체 (결과를 반환)
        const promise = new Promise((resolve, reject) =>{
            // 정상

            // reject('error');
        },2000);

        // console.log(promise);

        function increaseNum(num){
            return new Promise((resolve,reject) => {
                let condition = true;
                // let condition = false;
                if(condition){
                    const result = num + 1;
                    resolve(result);   
                }else{
                    reject('error');
                }
            });
        }

        let result = increaseNum(0);

        // =============================================================

        // ▶ Async / Await (위의 수평 체이닝의 증가의 복잡성에 대한 문제점 해결하기 위해 나타난)
        // async : 함수 선언 앞 사용, 해당 함수는 비동기를 의미
        // await : 비동기로 시행되는 코드 앞 사용, 작업완료때까지 대기 후 코드 실행
        // async 키워드가 있는 곳에서만 await 키워드를 쓸 수 있다.
        async function sync(){  //현재 비동기를 동기적으로 실행하고 있다.
            let result1 = await increaseNum(0);
            let result2 = await increaseNum(result1);
            let result3 = await increaseNum(result2);
            let result4 = await increaseNum(result3);
            return result4;
        }

        // console.log(sync()); //promise 객체가 넘겨진다.
        // 따라서 이것도 .then을 통해 결과를 받아야 하긴 해..
        sync()
            .then(res => console.log(res));

        
        async function main(){
            const result = await sync();
            console.log(result);
        }
        main();
