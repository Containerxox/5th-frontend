<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transform</title>
    <style>
        img:hover{
            transform: translate(100px, 100px);
            transform: scale(0.5);
            /* transform: rotate(45deg); */
            transform: skew(45deg);
            transform: perspective(1000px) rotateY(180deg);
            transition: 3s;

        }
    </style>
</head>
<body>
    <!-- /* transform */
        /* 2D */
        /* translate(x, y), translateX(x), translateY(y) : 이동 */
        /* scale(x, y), scaleX(x), scaleY(y) : 크기 */
        /* rotate(degree) 회전(각도) : 회전 */
        /* skew(x-deg, y-deg) : 기울임 */

        /* 3D */
        /* translate3d(x,y,z), translateZ(z) : 이동 */
        /* scale3d(x,y,z) scaleZ(z)  : 크기 */
        /* rotate3d(x,y,z,a(각도)), rotateX, ratateY, roatateZ : 회전 */
        /* perspective(n) : 원근법 */ -->

        <img src="https://cdn.pixabay.com/photo/2022/07/07/09/08/lighthouse-7306839_960_720.jpg" alt="house">
</body>
</html>
