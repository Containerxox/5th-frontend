<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>만족도 설문조사</title>
</head>
<body>
    <h1>고객 만족도 설문조사</h1>
    <form action="">
        <div>
            <label for="name"></label>
            이름 <input type="text" id="name">
        </div>
        <div>
            <label for="age"></label>
        나이 <input type="number" id="age">
        </div>
        
        <br>
        <br>
        <label for="">방문경로</label>
        <div>
            <input type="radio" name="visit-route"> 검색엔진
        </div>
        <div>
            <input type="radio" name="visit-route"> 광고
        </div>
        <div>
            <input type="radio" name="visit-route"> 지인추천
        </div>

        <br>
        <br>
        <label for="">관심주제(복수 선택 가능)</label>
        <div>
            <input type="checkbox"> 기술
        </div>
        <div>
            <input type="checkbox"> 디자인
        </div>
        <div>
            <input type="checkbox"> 마케팅
        </div>
    
        <br>
        <br>
        <label for="">방문빈도</label>
        <select name="" id="">
            <option value="" disabled selected>선택하세요</option>
            <option value="once-week">주 1회</option>
            <option value="twice-week">주 2회</option>
        </select>

        <br>
        <br>
        <div>
            <label for="feedback">추가 의견</label>
            <textarea 
                name="feedback" 
                id="feedback"
                placeholder="개선 사항이나 의견을 자유롭게 작성해주세요"
                rows="5"
                cols="50"
                maxlength="100">
            </textarea>
        </div>
    
        <br>
        <br>
        <input type="submit" value="제출하기">
    </form>
</body>
</html>
