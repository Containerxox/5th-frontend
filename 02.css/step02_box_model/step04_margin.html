<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Margin</title>
    <style>
        div.parent{
            width:480px;
            height: 200px;
            border: solid black 3px;
        }

        div.child{
            /* display: inline-block; */
            width: 100px;
            height: 100px;
            border: dashed red 3px;
            
            margin: 20px; 
            /* 요소들 간의 겹침 현상 일어날 수 있다.
            (수평은 겹침 현상 발생 X, 수직은 겹칩 현상 발생 O)*/
        }
    </style>
</head>
<body>
    <div class="parent">
        <div class="child"></div>
        <div class="child"></div>
    </div>
</body>
</html>
