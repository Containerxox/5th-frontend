<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
</head>
<body>
    <form action="">
        <label for="user-name">유저이름</label>
        <input type="text" name="" id="user-name" placeholder="이름을 입력하세요">
        <button type="submit">버튼</button>
    </form>

    <button type="button" aria-label="창닫기">X</button>

    <hr>

    <select name="car" id="">
        <option value="" selected disabled>차종선택</option>
        <optgroup label="독일브랜드">
            <option value="audi">아우디</option>
        </optgroup>
        <optgroup label="스웨덴브랜드">
            <option value="volvo">볼보</option>
        </optgroup>
    </select>

    <hr>

    <label for="feedback">의견 남겨주세요</label>
    <textarea 
        name="feedback" 
        id="feedback"
        placeholder="의견 남겨주세요"
        rows="5"
        cols="50"
        maxlength="100">
    </textarea>

    <hr>
    <form action="" method="POST">
        ID : <input type="text" name="uid" id="uid">
        PW : <input type="password" name="upw" id="upw">
    </form>

    <hr>
    <!-- radio는 택 일만 하게 하는 속성 -> 각 요소들이 동일한 name을 갖게 하자 -->
    <form action="" metho="POST">
        <input type="radio" name="fav-animal" id=""> 강아지
        <input type="radio" name="fav-animal" id=""> 고양이
    </form>

    <hr>
    <!-- checkbox는 다중 선택 가능 -->
    <form action="" metho="POST">
        <input type="checkbox" name="fav-animal" id=""> 강아지
        <input type="checkbox" name="fav-animal" id=""> 고양이
    </form>


    
    <hr>
    <h1>네이버 검색 서버</h1>
    <form action="https://search.naver.com/search.naver" method="get" target="_blank">
        <input type="text" name="query">
        <input type="submit" value="검색">
    </form>

    <hr>
    <h1>구글 검색 서버</h1>
    <form action="https://www.google.com/search" method="get" target="_blank">
        <input type="text" name="q">
        <input type="submit" value="검색">
    </form>



</body>
</html>
