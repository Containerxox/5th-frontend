        /**
         * 단지 개발자에게 정보 제공용 / 코드 실행에는 영향 X
         * @throws {TypeError}
         * @throws {RangeError}
         * */
        function validate(age){
            
            const numAge = Number(age); //age가 문자열이라면 숫자 변환시 NaN

            if(Number.isNaN(numAge)){
                throw new TypeError('나이는 숫자여야만 함~!');
            }

            if(numAge <0 || numAge > 120){
                throw new RangeError('나이는 0~120 사이 값이여야만 함');
            }

            return {valid: true, age: numAge};
        }

        console.log(validate(151));
        console.log(validate('hello'));
