    <!-- ▶ fetch -->
    <script>
        function fetchAjax(){

            // GET
            fetch("https://jsonplaceholder.typicode.com/users") //리턴값은 Promise 객체 => 즉, 비동기처리
                .then(response => response.json()) //json문자열-> 자바스크립트 객체로 변환
                .then(users => console.log(users)) //배열객체
                .catch(error => console.log(error));
        }
        fetchAjax();
    </script>
