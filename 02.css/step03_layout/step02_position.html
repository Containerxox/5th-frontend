<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Position</title>
    <style>
        /*▶ static 특징
            ↳ 기본값
            ↳ 문서흐름을 따라 배치
            ↳ 이동 불가 */

        /*▶ relative 특징
            ↳ 자기자신을 기준
            ↳ 원래 자리 유지 + 살짝 이동 가능
         */

        /*▶ absolute 특징
            ↳ 가장 가까운 position이 relative, absolute, fixed, (static 제외)로 설정된 조상 요소를 기준으로 위치 결정됨
            ↳ 문서 흐름 벗어나 자유롭게 위치 가능
            ↳ 만약 조상 요소 중에 relative, absolute, fixed가 없다면, body를 기준으로 삼음
         */

        /*▶ fixed 특징
            ↳ 브라우저 (viewport) 기준
            ↳ 스크롤해도 고정
         */

         /*▶ sticky 특징
            ↳ 스크롤 + 위치 도달
            ↳ 위치 도달 후 고정
         */

        div.parent{
            width: 500px;
            height: 1000px;
            border: 3px solid black;
            /* position: static; */
            position: relative;
            top: 100px;
        }

        div.child{
            width: 100px;
            height: 100px;
            background-color: red;

            position: fixed; 
            top: 100px;
            right: 100px;

        }

        /* ▶ sticky CSS */
        div.container{
            width: 400px;
            height: 800px;
            border: 3px solid red;
            margin: 50px;
            overflow:auto; /*sticky는 스크롤 되는 부모요소(container)를 기준으로 움직임*/
        }
        section.section {
            height: 300px;
            border: 2px dashed navy;
        }
        section.section h1{
            text-align: center;
            position: sticky;
            top: 0; /*h1이 스크롤 컨테이너(div.container)의 top:0 위치에 도달하면 붙음 */
        }

        
        /* Z축 관련 CSS */
        .box{
            width: 100px;
            height: 100px;
            background:red;
            border: 3px dashed navy;
            float: left;
            margin-left: -10px;
        }
        .box:nth-child(2n){
            margin-top: 30px;
        }

        .box3{
            position: relative;
            z-index: 1; /*숫자가 클수록 더 위에 올라온다 */
        }

    </style>
</head>
<body>
