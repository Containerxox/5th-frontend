<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List, Table</title>
</head>
<body>
    <!-- 리스트 -->
    <ul>
        <li>리스트</li>
        <li>리스트</li>
    </ul>

    <ol type="I">
        <li>물을 끓인다</li>
        <li>스프를 넣는다</li>
    </ol>

    <hr>

    <!-- dl 리스트 -->
    <dl>
        <dt>Q. 환불이 가능한가요?</dt>
        <dd>상품 수령 후 7일 이내에 가능합니다.</dd>

        <dt>Q. 배송 기간은 얼마나 걸리나요?</dt>
        <dd>영업일 기준 2~3일 소요됩니다.</dd>
    </dl>

    <hr>

    <!-- 테이블 -->
    <table border="1">
        <caption>< 회사 정보 ></caption>
        <thead>
            <tr>
                <th>회사</th>
                <th>연락처</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Cloud</td>
                <td>123-4567</td>
            </tr>
            <tr>
                <td>Front-end</td>
                <td>23-4212-23</td>
            </tr>   
        </tbody>
    </table>

    



</body>
</html>
