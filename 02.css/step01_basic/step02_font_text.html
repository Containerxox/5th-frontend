<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>font_text</title>
    <style>
        p{
            /* 16px = 1rem = 100% (크롬 기준) */
            font-size : 2rem;  
            font-weight: 100;
            font-style: italic;
            font-family: 'Times New Roman', Times, serif;
        }

        div{
            text-align:center;
            /* text-decoration-line: underline;
            text-decoration-style: double;
            text-decoration-color: cornflowerblue; */
            text-decoration: underline double cornflowerblue;
            line-height: 1.5; /*줄간격*/
            letter-spacing: 2px; /*글자 간격*/
            /*word-spacing: 2px;*/ /*단어 간격*/
        }

        a{
            text-decoration: none;
        }
    </style>
</head>
<body>
    <p>폰트</p>
    <div>Hello, CSS</div>
    <a href="">링크</a>

    <div>
        <div>Hello, CSS</div>
        <div>Hello, CSS</div>
    </div>
</body>
</html>
