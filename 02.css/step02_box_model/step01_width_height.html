<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Width_Height</title>
    <style>
        div{
            background-color: tomato;
            height: 100px; /* 블록 요소는 높이가 디폴트로 0 */
            max-width: none; /* 최대, 최소 너비/높이 설정 가능 -> 반응형 UI에 유용하게 쓰임*/
        }

        span{
            background-color: purple;
            height: 100px; /*인라인 요소는 높이, 너비 적용 불가 */
            width: 200px;  /*인라인 요소는 높이, 너비 적용 불가 */
        }
    </style>
</head>
<body>
    <!-- ▶ 블록 요소 -->
    <!-- 높이, 너비 설정 가능 (기본값 높이 0, 너비는 끝까지) -->
    <div></div>
    
    <hr>

    <!-- ▶ 인라인 요소 -->
    <!-- 크키 변화 불가능(높이, 너비 설정 불가)(높이, 너비 기본 0) -->
    <!-- 컨텐츠를 감쌀 정도의 크기만 가짐 -->
    <span>컨텐츠</span>
    <!-- <span></span> -->
</body>
</html>
